autolabeler:
    -   label: locales
        files:
            - 'src/*/locales/**'

    -   label: source
        files:
            - 'src/*/source/**'

    -   label: fix
        title:
            - '/^(fix|bug)(?:\([^)]*\))?:\s+\S/i'
            - '/^(?:\[(?:app|tests)\]:\s+)?(fix|bug)(?:ed)?\s+\S/i'

    -   label: added
        title:
            - '/^added(?:\([^)]*\))?:\s+\S/i'
            - '/^(?:\[(?:app|tests)\]:\s+)?added(?:ed)?\s+\S/i'

    -   label: removed
        title:
            - '/^removed(?:\([^)]*\))?:\s+\S/i'
            - '/^(?:\[(?:app|tests)\]:\s+)?removed(?:ed)?\s+\S/i'
