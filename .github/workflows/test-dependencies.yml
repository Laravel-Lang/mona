name: Test Dependencies

on:
    push:
        branches:
            - main
            - '*.x'
    pull_request:
    workflow_dispatch:

permissions: read-all

env:
    # Packages in the checkout share a version for self.version dependencies.
    COMPOSER_ROOT_VERSION: '20.0.0'

jobs:
    packages:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   id: set-dirs
                run: |
                    directories=$(find src -mindepth 2 -maxdepth 2 -name composer.json -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')
                    echo "directories=$directories" >> "$GITHUB_OUTPUT"

    install:
        needs: packages
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                directory: ${{ fromJson(needs.packages.outputs.directories) }}
                php: [ "8.3", "8.4", "8.5" ]
                laravel: [ "12.0", "13.0" ]

        name: ${{ matrix.directory }}, p${{ matrix.php }}, l${{ matrix.laravel }}

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                working-directory: ${{ matrix.directory }}
                run: |
                    composer config repositories.monorepo path '../*'
                    composer require --dev --update-with-all-dependencies 'laravel/framework:^${{ matrix.laravel }}' --no-interaction --no-progress

    install-master:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [ "8.4", "8.5" ]

        name: src/JsonFallback, p${{ matrix.php }}, dev-master

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                working-directory: src/JsonFallback
                run: |
                    composer config repositories.monorepo path '../*'
                    composer require --dev --no-update laravel/framework:dev-master --no-interaction
                    composer update --no-interaction --no-progress
