name: Autolabeler

on:
    # Fork PR labeling requires an Actions policy allowing this event for this workflow.
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - edited

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            -   uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
                with:
                    config-name: autolabeler.yml
