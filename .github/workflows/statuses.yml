name: Translation Status

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    pull-requests: write
    contents: write

jobs:
    sync:
        name: Synchronize
        if: github.ref == 'refs/heads/main'
        concurrency: translation-status
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    ref: main

            -   uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.5'
                    extensions: intl, zip

            -   name: Install dependencies
                run: composer update --no-progress --no-interaction

            -   name: Update status
                run: |
                    php src/Toolkit/bin/toolkit status src/Actions
                    php src/Toolkit/bin/toolkit status src/Attributes
                    php src/Toolkit/bin/toolkit status src/HttpStatuses
                    php src/Toolkit/bin/toolkit status src/Lang
                    php src/Toolkit/bin/toolkit status src/MoonShine
                    php src/Toolkit/bin/toolkit status src/StarterKits

            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
                id: pullRequest
                with:
                    branch: projects/status
                    delete-branch: true
                    add-paths: ':(glob)src/*/locales/*/_status.json'
                    title: "[source]: Translations status has been updated"
                    commit-message: 📃 Translation statuses have been updated
                    body: 📃 Translation statuses have been updated
                    labels: |
                        statuses
                        skip-changelog

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GH_TOKEN: ${{ github.token }}
                    PR_NUMBER: ${{ steps.pullRequest.outputs.pull-request-number }}
                    PR_HEAD_SHA: ${{ steps.pullRequest.outputs.pull-request-head-sha }}
                run: gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$PR_HEAD_SHA"
