name: Code Style

on:
    push:
        branches:
            - main
            - '*.x'
    pull_request:

permissions:
    contents: write
    pull-requests: write

jobs:
    php_composer:
        name: Composer
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   name: Detecting to make changes
                id: can_fix
                shell: bash
                run: |
                    CAN_FIX=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

                    echo "CAN_FIX=${CAN_FIX}" >> "$GITHUB_ENV"

            -   name: Install Composer dependencies
                run: composer update

            -   name: Check styles
                if: env.CAN_FIX == 'false'
                run: composer normalize --dry-run

            -   name: Fix styles
                if: env.CAN_FIX == 'true'
                run: composer normalize

            -   name: Collect changed files
                if: env.CAN_FIX == 'true'
                id: changed_composer
                shell: bash
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git ls-files -m > changed.txt || true

                    if [ -s changed.txt ]; then
                        echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Stage changed files preserving paths
                if: env.CAN_FIX == 'true' && steps.changed_composer.outputs.has_changes == 'true'
                shell: bash
                run: |
                    mkdir -p .artifacts/composer
                    while IFS= read -r f; do
                        [ -f "$f" ] || continue
                        mkdir -p ".artifacts/composer/$(dirname "$f")"
                        cp "$f" ".artifacts/composer/$f"
                    done < changed.txt

            -   name: Upload changed files
                if: env.CAN_FIX == 'true' && steps.changed_composer.outputs.has_changes == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: fixes-composer
                    path: .artifacts/composer

    php_rector:
        name: Rector
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   name: Detecting to make changes
                id: can_fix
                shell: bash
                run: |
                    CAN_FIX=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

                    echo "CAN_FIX=${CAN_FIX}" >> "$GITHUB_ENV"

            -   name: Install Composer dependencies
                run: composer update

            -   name: Check styles
                if: env.CAN_FIX == 'false'
                run: php vendor/bin/rector --dry-run

            -   name: Fix styles
                if: env.CAN_FIX == 'true'
                run: php vendor/bin/rector

            -   name: Collect changed files
                if: env.CAN_FIX == 'true'
                id: changed_rector
                shell: bash
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git ls-files -m > changed.txt || true

                    if [ -s changed.txt ]; then
                        echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Stage changed files preserving paths
                if: env.CAN_FIX == 'true' && steps.changed_rector.outputs.has_changes == 'true'
                shell: bash
                run: |
                    mkdir -p .artifacts/rector
                    while IFS= read -r f; do
                        [ -f "$f" ] || continue
                        mkdir -p ".artifacts/rector/$(dirname "$f")"
                        cp "$f" ".artifacts/rector/$f"
                    done < changed.txt

            -   name: Upload changed files
                if: env.CAN_FIX == 'true' && steps.changed_rector.outputs.has_changes == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: fixes-rector
                    path: .artifacts/rector

    php_pint:
        name: Pint
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   name: Detecting to make changes
                id: can_fix
                shell: bash
                run: |
                    CAN_FIX=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

                    echo "CAN_FIX=${CAN_FIX}" >> "$GITHUB_ENV"

            -   name: Install Composer dependencies
                run: composer update

            -   name: Check styles
                if: env.CAN_FIX == 'false'
                run: php vendor/bin/pint --parallel --test

            -   name: Fix styles
                if: env.CAN_FIX == 'true'
                run: php vendor/bin/pint --parallel

            -   name: Collect changed files
                if: env.CAN_FIX == 'true'
                id: changed_pint
                shell: bash
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git ls-files -m > changed.txt || true

                    if [ -s changed.txt ]; then
                        echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Stage changed files preserving paths
                if: env.CAN_FIX == 'true' && steps.changed_pint.outputs.has_changes == 'true'
                shell: bash
                run: |
                    mkdir -p .artifacts/pint
                    while IFS= read -r f; do
                        [ -f "$f" ] || continue
                        mkdir -p ".artifacts/pint/$(dirname "$f")"
                        cp "$f" ".artifacts/pint/$f"
                    done < changed.txt

            -   name: Upload changed files
                if: env.CAN_FIX == 'true' && steps.changed_pint.outputs.has_changes == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: fixes-pint
                    path: .artifacts/pint

    php_stan:
        name: PHPStan
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   name: Install Composer dependencies
                run: composer update

            -   name: Check styles
                run: php vendor/bin/phpstan analyse --memory-limit=-1

    node_lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   uses: actions/setup-node@v7
                with:
                    node-version: 'latest'

            -   name: Detecting to make changes
                id: can_fix
                shell: bash
                run: |
                    CAN_FIX=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                    
                    echo "CAN_FIX=${CAN_FIX}" >> "$GITHUB_ENV"

            -   name: Install dependencies
                run: npm i

            -   name: Check styles
                if: env.CAN_FIX == 'false'
                run: npx biome check

            -   name: Fix styles
                if: env.CAN_FIX == 'true'
                run: npx biome lint --write

            -   name: Remove node_modules
                if: env.CAN_FIX == 'true'
                run: rm -rf node_modules

            -   name: Collect changed files
                if: env.CAN_FIX == 'true'
                id: changed_lint
                shell: bash
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git ls-files -m > changed.txt || true

                    if [ -s changed.txt ]; then
                        echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Stage changed files preserving paths
                if: env.CAN_FIX == 'true' && steps.changed_lint.outputs.has_changes == 'true'
                shell: bash
                run: |
                    mkdir -p .artifacts/lint
                    while IFS= read -r f; do
                        [ -f "$f" ] || continue
                        mkdir -p ".artifacts/lint/$(dirname "$f")"
                        cp "$f" ".artifacts/lint/$f"
                    done < changed.txt

            -   name: Upload changed files
                if: env.CAN_FIX == 'true' && steps.changed_lint.outputs.has_changes == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: fixes-lint
                    path: .artifacts/lint

    node_format:
        name: Format
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2

            -   uses: actions/setup-node@v7
                with:
                    node-version: 'latest'

            -   name: Detecting to make changes
                id: can_fix
                shell: bash
                run: |
                    CAN_FIX=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                    
                    echo "CAN_FIX=${CAN_FIX}" >> "$GITHUB_ENV"

            -   name: Install dependencies
                run: npm i

            -   name: Check styles
                if: env.CAN_FIX == 'false'
                run: npx biome format

            -   name: Fix styles
                if: env.CAN_FIX == 'true'
                run: npx biome format --write

            -   name: Remove node_modules
                if: env.CAN_FIX == 'true'
                run: rm -rf node_modules

            -   name: Collect changed files
                if: env.CAN_FIX == 'true'
                id: changed_format
                shell: bash
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git ls-files -m > changed.txt || true

                    if [ -s changed.txt ]; then
                        echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Stage changed files preserving paths
                if: env.CAN_FIX == 'true' && steps.changed_format.outputs.has_changes == 'true'
                shell: bash
                run: |
                    mkdir -p .artifacts/format
                    while IFS= read -r f; do
                        [ -f "$f" ] || continue
                        mkdir -p ".artifacts/format/$(dirname "$f")"
                        cp "$f" ".artifacts/format/$f"
                    done < changed.txt

            -   name: Upload changed files
                if: env.CAN_FIX == 'true' && steps.changed_format.outputs.has_changes == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: fixes-format
                    path: .artifacts/format

    pr:
        needs:
            - php_composer
            - php_rector
            - php_pint
            - php_stan
            - node_lint
            - node_format
        
        name: PR
        runs-on: ubuntu-latest
        
        if: |
            always() && 
            github.event_name == 'push' && 
            github.ref == 'refs/heads/main' &&
            (needs.php_composer.result == 'success' || needs.php_rector.result == 'success' ||
             needs.php_pint.result == 'success' || needs.node_lint.result == 'success' ||
             needs.node_format.result == 'success')

        steps:
            -   uses: actions/checkout@v7

            -   name: Download all artifacts and merge
                uses: actions/download-artifact@v8
                with:
                    merge-multiple: true
                    path: .

            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                if: ${{ !cancelled() }}
                with:
                    branch: code-style
                    branch-suffix: random
                    delete-branch: true
                    title: "🦋 The code style has been fixed"
                    commit-message: 🦋 The code style has been fixed
                    body: The code style has been fixed
                    labels: code-style

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge --merge --delete-branch ${{ steps.pullRequest.outputs.pull-request-number }} --admin
